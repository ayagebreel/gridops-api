services:

  db:
    image: postgres:16


    environment:
      POSTGRES_USER: grid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: gridops

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s


  api:
    build: .

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+psycopg://grid:${POSTGRES_PASSWORD}@db:5432/gridops

    depends_on:
      db:
        condition: service_healthy




volumes:
  postgres_data: